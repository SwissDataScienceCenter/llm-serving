{{- if .Values.authentik.enabled }}
  {{- /* The subchart defaults this to "<release>-postgresql", which will not resolves. */}}
  {{- $_ := .Values.authentik.authentik.postgresql.host | required ".Values.authentik.authentik.postgresql.host is required: the chart does not deploy PostgreSQL" }}
{{- end }}
{{- if .Values.openwebui.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "postgres-secret"
type: Opaque
stringData:
  OPENWEBUI_DATABASE_URL: "postgresql://openwebui:{{ .Values.openwebui.postgres.password | required ".Values.openwebui.postgres.password is required" }}@{{ .Values.postgresql.host | required ".Values.postgresql.host is required" }}:5432/openwebui?sslmode=require"
{{- end }}
