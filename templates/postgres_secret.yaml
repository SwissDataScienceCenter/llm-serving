{{- if .Values.authentik.enabled }}
  {{- /* The subchart defaults this to "<release>-postgresql", which will not resolve. */}}
  {{- $_ := .Values.authentik.authentik.postgresql.host | required ".Values.authentik.authentik.postgresql.host is required: the chart does not deploy PostgreSQL" }}
{{- end }}
{{- if .Values.openwebui.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "openwebui.fullname" . }}-postgres"
type: Opaque
  {{- $pg := .Values.openwebui.postgres }}
  {{- /* One value fills both db and role. */}}
  {{- $db := $pg.database | required ".Values.openwebui.postgres.database is required" }}
  {{- $host := $pg.host | required ".Values.openwebui.postgres.host is required" }}
  {{- $password := $pg.password | required ".Values.openwebui.postgres.password is required" }}
stringData:
  OPENWEBUI_DATABASE_URL: "postgresql://{{ $db }}:{{ $password }}@{{ $host }}:5432/{{ $db }}?sslmode={{ $pg.sslMode }}"
{{- end }}
