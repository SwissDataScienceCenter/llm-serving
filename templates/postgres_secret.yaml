{{- if .Values.authentik.enabled }}
  {{- /* The subchart defaults this to "<release>-postgresql", which will not resolves. */}}
  {{- $_ := .Values.authentik.authentik.postgresql.host | required ".Values.authentik.authentik.postgresql.host is required: the chart does not deploy PostgreSQL" }}
{{- end }}
{{- if .Values.openwebui.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "postgres-secret"
type: Opaque
  {{- $pg := .Values.openwebui.postgres }}
  {{- /* One value fills both db and role. */}}
  {{- $db := $pg.database | required ".Values.openwebui.postgres.database is required" }}
stringData:
  OPENWEBUI_DATABASE_URL: "postgresql://{{ $db }}:{{ $pg.password | required ".Values.openwebui.postgres.password is required" }}@{{ $pg.host | required ".Values.openwebui.postgres.host is required" }}:5432/{{ $db }}?sslmode=require"
{{- end }}
