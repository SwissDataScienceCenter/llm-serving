{{- if and .Values.openwebui.enabled .Values.openwebui.searxng.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "openwebui.searxng.fullname" . }}-settings"
  labels:
    app: searxng
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
stringData:
  settings.yml: |
    server:
      secret_key: {{ randAlphaNum 32 | quote }}
      limiter: false
      public_instance: false
    general:
      instance_name: {{ printf "%s-searxng" .Release.Name | quote }}
      debug: false
    search:
      safe_search: {{ .Values.openwebui.searxng.safeSearch }}
      autocomplete: ""
      default_lang: ""
      formats:
        - html
        - json
    {{- if .Values.openwebui.searxng.extraSettings }}
    {{- toYaml .Values.openwebui.searxng.extraSettings | nindent 4 }}
    {{- end }}
{{- end }}
