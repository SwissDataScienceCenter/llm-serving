apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-openwebui
  labels:
    app: openwebui
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  selector:
    app: openwebui
    release: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
