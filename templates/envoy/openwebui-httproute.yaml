apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "envoy.fullname" . }}-openwebui
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
  - openwebui.{{ .Values.envoy.baseDomain }}
  parentRefs:
    - name: {{ include "envoy.fullname" . }}
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
  - backendRefs:
      - name: openwebui
        namespace: {{ .Release.Namespace }}
        port: 8080
  
