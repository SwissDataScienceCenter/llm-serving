apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: metering-ext-proc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "envoy.fullname" . }}-models
  extProc:
    - backendRefs:
        - name: {{ include "envoy.fullname" . }}-extension-service
          port: 9002
      processingMode:
        request: {}
        response: 
          body: Streamed

