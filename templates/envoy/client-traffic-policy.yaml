{{- if .Values.envoy.enabled }}
# By default, Envoy Gateway sets the buffer limit to 32kiB which is not sufficient for AI workloads.
# This ClientTrafficPolicy sets the buffer limit as configured.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: client-buffer-limit
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "envoy.fullname" . }}
  connection:
    bufferLimit: {{ .Values.envoy.clientBufferLimit | default "50Mi" }}
{{- end }}
