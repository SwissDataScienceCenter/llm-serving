{{- if .Values.envoy.enabled }}
# One gateway-scoped policy: listener-scoped ClientTrafficPolicy override it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "envoy.fullname" . }}-client-buffer-limit
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "envoy.fullname" . }}
  # By default, Envoy Gateway sets the buffer limit to 32kiB which is not sufficient for AI workloads.
  connection:
    bufferLimit: {{ .Values.envoy.clientBufferLimit | default "50Mi" }}
{{- /* A client-set x-sub would outrank the verified claim: jwt_authn appends, and
  readers take the first value. Mirror claimToHeaders in security-policy.yaml. */}}
  headers:
    earlyRequestHeaders:
      remove:
        - x-sub
        - x-name
{{- end }}
