{{- if .Values.envoy.enabled }}
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIGatewayRoute
metadata:
  name: {{ include "envoy.fullname" . }}-models
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ include "envoy.fullname" . }}
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: https-gateway
  llmRequestCosts:
    - metadataKey: llm_total_token
      type: TotalToken
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
  rules:
  {{- range $name, $model := .Values.models }}
    {{- if or $model.internal (and (not $model.internal) $model.apiUrl) }}
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ $model.fullName }}
      backendRefs:
        - name: {{ include "model.fullname" (merge (dict "modelName" $name) $) }}
    {{- end }}
  {{- end }}
  {{- /* The backend serves the target under its fullName, so the gateway rewrites the alias. */}}
  {{- range $alias, $target := .Values.modelAliases }}
    {{- $model := index $.Values.models $target | default dict }}
    {{- if not (or $model.internal $model.apiUrl) }}
      {{- fail (printf "modelAliases.%s: %q is not a routed model in .Values.models" $alias $target) }}
    {{- end }}
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ $alias }}
      backendRefs:
        - name: {{ include "model.fullname" (merge (dict "modelName" $target) $) }}
          modelNameOverride: {{ $model.fullName }}
  {{- end }}
{{- end }}
