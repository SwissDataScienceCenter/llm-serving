{{- if and .Values.authentik.enabled .Values.authentik.blueprints.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.authentik.blueprints.secrets | first }}
type: Opaque
stringData:
  authentik-config.yaml: |
    version: 1
    metadata:
      name: vllm-authentik-config
    entries:
      # GitLab OAuth Source (no dependencies)
      - model: authentik_sources_oauth.oauthsource
        identifiers:
          slug: datascience-gitlab
        attrs:
          name: datascience-gitlab
          authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
          enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
          provider_type: openidconnect
          consumer_key: {{ .Values.authentik.gitlabOidc.clientId }}
          consumer_secret: {{ .Values.authentik.gitlabOidc.clientSecret }}
          authorization_url: https://gitlab.datascience.ch/oauth/authorize
          access_token_url: https://gitlab.datascience.ch/oauth/token
          profile_url: https://gitlab.datascience.ch/oauth/userinfo
          oidc_well_known_url: https://gitlab.datascience.ch/.well-known/openid-configuration
          enabled: true
          icon: {{ .Values.authentik.gitlabOidc.iconUrl | default "" }}

      # Gateway admins group (no dependencies, needed by policybinding)
      - model: authentik_core.group
        identifiers:
          name: gateway admins

      # Service account (no dependencies)
      - model: authentik_core.user
        identifiers:
          username: vllm-service-account
        attrs:
          name: vllm-service-account
          is_active: true
          type: service_account

      # OAuth2 Provider (depends on: certificatekeypair #1)
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: vllm
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: {{ .Values.authentik.oauthApp.clientId }}
          client_secret: {{ .Values.authentik.oauthApp.clientSecret }}
          grant_types:
            - authorization_code
            - hybrid
            - implicit
            - client_credentials
            - password
            - urn:ietf:params:oauth:grant-type:device_code
            - refresh_token
          redirect_uris:
            - url: "https://openwebui.{{ .Values.envoy.baseDomain }}/.*"
              matching_mode: regex
              redirect_uri_type: authorization
          access_token_validity: {{ .Values.authentik.oauthApp.accessTokenValidity | default "days=30" }}
          refresh_token_validity: {{ .Values.authentik.oauthApp.refreshTokenValidity | default "days=365" }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          encryption_key: 
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, entitlements]]

      # OAuth2 Application (depends on: oauth2provider #5)
      - model: authentik_core.application
        identifiers:
          slug: vllm
        attrs:
          name: vllm
          slug: vllm
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, vllm]]

      # Entitlement (depends on: application #6)
      - model: authentik_core.applicationentitlement
        identifiers:
          name: is_admin
        attrs:
          app: !Find [authentik_core.application, [slug, vllm]]

      # Policy binding (depends on: applicationentitlement #7, group #3)
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.applicationentitlement, [name, is_admin]]
          group: !Find [authentik_core.group, [name, gateway admins]]
        attrs:
          enabled: true
          order: 10

      # Identification stage (depends on: oauthsource #2)
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          sources:
            - !Find [authentik_sources_oauth.oauthsource, [slug, datascience-gitlab]]

      # Brand (depends on: default-device-code flow, which is a built-in flow)
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          flow_device_code: !Find [authentik_flows.flow, [slug, default-source-pre-authentication]]
{{- end }}
