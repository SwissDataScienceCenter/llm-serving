apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-init-deployment"
  labels:
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 6
  template:
    metadata:
      name: "{{.Release.Name}}-init-deployment"
      labels:
        heritage: {{ .Release.Service }}
        release: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: check-openwebui
          image: alpine/curl:latest
          command: ["sh", "-c", "until curl -f 'http://openwebui.{{ .Release.Namespace }}.svc.cluster.local:8080/health'; do echo waiting for openwebui; sleep 2; done"]
      containers:
        - name: init-deployment
          image: {{ .Values.initJob.image.repository | default "ghcr.io/swissdatasciencecenter/llm-serving/init" }}:{{ .Values.initJob.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.initJob.image.pullPolicy | default "IfNotPresent" }}
          args: ["init"]
          env:
            - name: INIT_OPEN_WEBUI__ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: init-secret
                  key: OPENWEBUI_ADMIN_PASSWORD
            - name: CONFIG_PATH
              value: /svc/config.toml
          resources:
            requests:
              cpu: 0.5
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: init-secret
              mountPath: /svc/config.toml
              subPath: config.toml
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
{{- end }}
      volumes:
        - name: init-secret
          secret:
            secretName: init-secret
