{{- if and .Values.envoy.enabled .Values.envoy.telemetry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otlp-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    app: otlp-bridge
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.envoy.telemetry.replicas | default 1 }}
  selector:
    matchLabels:
      app: otlp-bridge
  template:
    metadata:
      labels:
        app: otlp-bridge
        release: {{ .Release.Name }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml .Values.global.imagePullSecrets | indent 8 }}
      {{- end }}
      containers:
        - name: bridge
          image: {{ .Values.envoy.telemetry.image.repository | default "ghcr.io/swissdatasciencecenter/sdsc-llm-deployment/otlp-bridge" }}:{{ .Values.envoy.telemetry.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.envoy.telemetry.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 4317
              name: grpc
          env:
            - name: REMOTE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: otlp-bridge-config
                  key: remote-api-url
            - name: GRPC_LISTEN_ADDR
              value: ":4317"
            - name: METRIC_CODE
              value: {{ .Values.envoy.telemetry.metricCode | default "genai.tokens" | quote }}
            - name: CUSTOMER_ID
              value: {{ .Values.envoy.telemetry.customerId | quote }}
            - name: ORGANIZATION_SLUG
              value: {{ .Values.envoy.telemetry.organizationSlug | quote }}
            - name: BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: otlp-bridge-secret
                  key: bearer-token
          resources:
            {{- toYaml .Values.envoy.telemetry.resources | nindent 12 }}
{{- end }}
