{{- if and .Values.envoy.enabled .Values.envoy.telemetry.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: otlp-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    app: otlp-bridge
    release: {{ .Release.Name }}
spec:
  selector:
    app: otlp-bridge
  ports:
    - protocol: TCP
      port: 4317
      targetPort: 4317
      name: grpc
  type: ClusterIP
{{- end }}
