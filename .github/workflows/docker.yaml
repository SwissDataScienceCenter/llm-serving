name: docker
# Build one image and push it to GHCR. Push and tags optional.
on:
  workflow_call:
    inputs:
      name:
        description: "Image name under the GHCR namespace"
        required: true
        type: string
      context:
        description: "Build context directory"
        required: true
        type: string
      tag:
        description: "Extra tag to publish, e.g. pr-12-a1b2c3d. Empty to rely on the tags derived from the ref."
        required: false
        default: ""
        type: string
      push:
        description: "Push to GHCR. False builds only, which still checks the Dockerfile."
        required: false
        default: false
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/swissdatasciencecenter/llm-serving/${{ inputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
