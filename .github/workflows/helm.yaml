name: helm
# Reusable: package the chart with the release tag and push it to GHCR as an OCI artifact.
# Runs in the Nix dev shell so helm/just match local development.
on:
  workflow_call:

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix

      - name: Render templates with dummy values
        run: |
          nix develop --no-pure-eval --accept-flake-config "./tools/nix#ci" --command \
            just helm::template --values tools/helm/lint-values.yaml

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop --no-pure-eval --accept-flake-config "./tools/nix#ci" --command \
            bash -c 'echo "$GHCR_TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin'

      - name: Package and push chart
        run: |
          nix develop --no-pure-eval --accept-flake-config "./tools/nix#ci" --command \
            just helm::publish "${{ github.ref_name }}"
