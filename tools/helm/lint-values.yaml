envoy:
  telemetry:
    enabled: true
authentik:
  authentik:
    postgresql:
      host: pg.example.invalid
      password: dummy
  oauthApp:
    clientId: dummy
    clientSecret: dummy
openwebui:
  admin:
    password: dummy
  postgres:
    host: pg.example.invalid
    password: dummy
models:
  lint: &model
    fullName: org/lint-model
    internal: true
    apiKey: dummy
    persistence: { enabled: true } # renders models/pvc.yaml and the chart-owned claim
    resources:
      requests: { cpu: 1, memory: 1G }
      limits: { cpu: 2, memory: 2G }
  # exercises the external-claim branch (persistence off, no cacheDir.path)
  lint-byoc:
    <<: *model
    persistence: { enabled: false }
    cacheDir: { claimName: pvc-example-home }
