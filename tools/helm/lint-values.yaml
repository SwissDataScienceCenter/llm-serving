# Dummy values so `helm template` (just lint) can render required fields.
authentik:
  authentik:
    postgresql:
      host: pg.example.invalid
      password: dummy
  oauthApp:
    clientId: dummy
    clientSecret: dummy
openwebui:
  admin:
    password: dummy
  postgres:
    host: pg.example.invalid
    password: dummy
initJob:
  image: {}
# One model so `helm template` actually renders templates/models and the per-model
# envoy objects; without it every `range .Values.models` iterates zero times.
models:
  lint:
    fullName: org/lint-model
    internal: true
    apiKey: dummy
    resources:
      requests: { cpu: 1, memory: 1G }
      limits: { cpu: 2, memory: 2G }
