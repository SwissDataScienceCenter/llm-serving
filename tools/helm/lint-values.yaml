envoy:
  telemetry:
    enabled: true
    openmeterUrl: https://openmeter.example.invalid
    bearerToken: dummy
# Dummy values so `helm template` (just lint) can render required fields.
authentik:
  authentik:
    postgresql:
      host: pg.example.invalid
      password: dummy
  oauthApp:
    clientId: dummy
    clientSecret: dummy
openwebui:
  admin:
    password: dummy
  postgres:
    host: pg.example.invalid
    password: dummy
models:
  lint:
    fullName: org/lint-model
    internal: true
    apiKey: dummy
    resources:
      requests: { cpu: 1, memory: 1G }
      limits: { cpu: 2, memory: 2G }
  # exercises the external-claim branch (persistence off, no cacheDir.path)
  lint-byoc:
    fullName: org/lint-byoc
    internal: true
    apiKey: dummy
    cacheDir: { claimName: pvc-example-home }
    resources:
      requests: { cpu: 1, memory: 1G }
      limits: { cpu: 2, memory: 2G }
