envoy:
  telemetry:
    enabled: true
authentik:
  authentik:
    postgresql:
      host: pg.example.invalid
      password: dummy
  oauthApp:
    clientId: dummy
    clientSecret: dummy
openwebui:
  admin:
    password: dummy
  postgres:
    host: pg.example.invalid
    passwordSecret:
      name: dummy-pg
  searxng:
    enabled: true
    extraSettings: # exercises the extraSettings passthrough into settings.yml
      general:
        instance_name: lint-searxng
models:
  lint: &model
    fullName: org/lint-model
    internal: true
    apiKey: dummy
    persistence: { enabled: true } # renders models/pvc.yaml and the chart-owned claim
    env: # exercises the custom env vars templated into knative-serving.yaml
      - name: MODEL_CUSTOM_VAR
        value: custom-value
      - name: MODEL_SECRET_VAR
        valueFrom:
          secretKeyRef:
            name: my-secret
            key: my-key
    resources:
      requests: { cpu: 1, memory: 1G }
      limits: { cpu: 2, memory: 2G }
  # exercises the external-claim branch (persistence off, no cacheDir.path)
  lint-byoc:
    <<: *model
    persistence: { enabled: false }
    cacheDir: { claimName: pvc-example-home }
modelAliases:
  lint-alias: lint
